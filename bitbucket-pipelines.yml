image: rust:latest

options:
  max-time: 30

pipelines:
  default:
    - step:
        name: Enforce Test Structure
        script:
          # Check that no #[test] or mod tests blocks exist in production source files
          # Production files are in mmnes_core/src/ but NOT in mmnes_core/src/tests/
          - |
            echo "Checking for inline tests in production source files..."
            # Find #[test] in production files (exclude tests/ directory)
            if find mmnes_core/src -path mmnes_core/src/tests -prune -o -name '*.rs' -print | xargs grep -l '#\[test\]' 2>/dev/null; then
              echo "ERROR: Found #[test] in production source files. Tests must live in src/tests/"
              exit 1
            fi
            # Find 'mod tests' blocks in production files (exclude tests/ directory and lib.rs which has 'pub mod tests;')
            if find mmnes_core/src -path mmnes_core/src/tests -prune -o -name '*.rs' ! -name 'lib.rs' -print | xargs grep -l 'mod tests' 2>/dev/null; then
              echo "ERROR: Found 'mod tests' block in production source files. Tests must live in src/tests/"
              exit 1
            fi
            echo "Test structure check passed!"
    - step:
        caches:
          - cargo-home
          - cargo-target
        name: Build and Test
        script:
          - rustup update
          - apt-get update && apt-get install -y --no-install-recommends libsdl2-dev
          - cargo build --verbose
          - cargo test --verbose
          - cargo test test_all_opcodes -- --ignored --nocapture
    - step:
        name: Mirror to GitHub
        script:
          - git fetch --prune --unshallow --tags || true
          - export GITHUB_URL="https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
          - git remote add github "${GITHUB_URL}" || git remote set-url github "${GITHUB_URL}"
          - git push --prune github +refs/heads/*:refs/heads/*
          - git push --prune github +refs/tags/*:refs/tags/*

  branches:
    main:
      - step:
          name: Enforce Test Structure
          script:
            # Check that no #[test] or mod tests blocks exist in production source files
            - |
              echo "Checking for inline tests in production source files..."
              if find mmnes_core/src -path mmnes_core/src/tests -prune -o -name '*.rs' -print | xargs grep -l '#\[test\]' 2>/dev/null; then
                echo "ERROR: Found #[test] in production source files. Tests must live in src/tests/"
                exit 1
              fi
              if find mmnes_core/src -path mmnes_core/src/tests -prune -o -name '*.rs' ! -name 'lib.rs' -print | xargs grep -l 'mod tests' 2>/dev/null; then
                echo "ERROR: Found 'mod tests' block in production source files. Tests must live in src/tests/"
                exit 1
              fi
              echo "Test structure check passed!"
      - step:
          caches:
            - cargo-home
            - cargo-target
          name: Build and Test
          script:
            - rustup update
            - apt-get update && apt-get install -y --no-install-recommends libsdl2-dev
            - cargo build --verbose
            - cargo test --verbose
            - cargo test test_all_opcodes -- --ignored --nocapture
      - step:
          name: Collect Metrics with Coverage
          caches:
            - cargo-home
            - cargo-target
            - pip
          script:
            - apt-get update && apt-get install -y --no-install-recommends libsdl2-dev python3 python3-pip python3-venv
            - rustup component add llvm-tools-preview
            - cargo install rust-code-analysis-cli cargo-llvm-cov --locked
            # Use virtual environment for Python packages
            - python3 -m venv /tmp/venv
            - source /tmp/venv/bin/activate
            - pip install -r metrics/requirements.txt
            # Collect metrics (appends to existing CSV)
            - python3 metrics/collect_metrics.py --with-coverage
            - python3 metrics/plot_metrics.py
            # Commit updated metrics back to repo
            - git config user.email "ci@bitbucket.org"
            - git config user.name "Bitbucket CI"
            - git add metrics/data/
            - |
              if git diff --staged --quiet; then
                echo "No metrics changes to commit"
              else
                git commit -m "Update metrics data [skip ci]"
                git push origin main
              fi
          artifacts:
            - metrics/data/*.csv
            - metrics/data/*.png
            - metrics/data/*.md
      - step:
          name: Mirror to GitHub
          script:
            - git fetch --prune --unshallow --tags || true
            - export GITHUB_URL="https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
            - git remote add github "${GITHUB_URL}" || git remote set-url github "${GITHUB_URL}"
            - git push --prune github +refs/heads/*:refs/heads/*
            - git push --prune github +refs/tags/*:refs/tags/*
definitions:
  caches:
    cargo-home: $HOME/.cargo
    cargo-target: target